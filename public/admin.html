<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Exile Downloads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="site">
      <div class="brand">
        <div class="sigil"></div>
        <div>
          <h1>Admin Panel</h1>
          <div class="sub">Manage the exile downloads</div>
        </div>
      </div>
      <a class="btn" href="/">Back to site</a>
    </header>

    <div id="setupView" class="login-box card" style="display:none;">
      <h2>First-Time Setup</h2>
      <p style="color:var(--ink-dim);font-size:13px;margin:0 0 14px;">No admin password has been configured yet. Create one now.</p>
      <div class="field">
        <label>Username</label>
        <input id="setupUsername" type="text" autocomplete="username" value="admin" />
      </div>
      <div class="field">
        <label>Password</label>
        <input id="setupPassword" type="password" autocomplete="new-password" />
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input id="setupConfirm" type="password" autocomplete="new-password" />
      </div>
      <button class="btn primary" id="setupBtn">Create Admin</button>
      <div id="setupErr" style="color:#f0a0a0;margin-top:10px;font-size:13px;"></div>
    </div>

    <div id="loginView" class="login-box card" style="display:none;">
      <h2>Enter the Sanctum</h2>
      <div class="field">
        <label>Username</label>
        <input id="username" type="text" autocomplete="username" />
      </div>
      <div class="field">
        <label>Password</label>
        <input id="password" type="password" autocomplete="current-password" />
      </div>
      <button class="btn primary" id="loginBtn">Enter</button>
      <div id="loginErr" style="color:#f0a0a0;margin-top:10px;font-size:13px;"></div>
    </div>

    <div id="adminView" style="display:none;">
      <div class="admin-toolbar">
        <h2 style="margin:0;">Downloads</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn" id="uploadIconBtn">📷 Upload Icon</button>
          <input type="file" id="iconUploadInput" accept="image/*" style="display:none;" />
          <button class="btn primary" id="addBtn">+ Add Download</button>
        </div>
      </div>
      <div id="adminList"></div>
      <div id="adminEmpty" class="empty" style="display:none;">No downloads yet. Add one to begin.</div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <h2 id="modalTitle">Add Download</h2>
      <div class="field">
        <label>Title</label>
        <input id="mTitle" type="text" />
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="mDesc"></textarea>
      </div>
      <div class="field">
        <label>File (optional if link provided)</label>
        <input id="mFile" type="file" />
        <div id="mFileHint" style="color:var(--ink-muted);font-size:12px;margin-top:4px;"></div>
      </div>
      <div class="field">
        <label>Or paste a link (URL)</label>
        <input id="mUrl" type="url" placeholder="https://example.com/file.zip" />
      </div>
      <div class="field">
        <label>Icon / Image (optional)</label>
        <input id="mIcon" type="file" accept="image/*" />
        <div id="mIconHint" style="color:var(--ink-muted);font-size:12px;margin-top:4px;"></div>
      </div>
      <div class="field">
        <label>Or icon URL (favicon/picture)</label>
        <input id="mIconUrl" type="url" placeholder="https://example.com/favicon.ico" />
      </div>
      <div class="field">
        <label>Or pick an already uploaded icon</label>
        <div id="iconGallery" style="display:flex;flex-wrap:wrap;gap:8px;max-height:160px;overflow:auto;padding:6px;border:1px solid var(--border);background:rgba(10,8,12,0.4);"></div>
        <input type="hidden" id="mIconExisting" value="" />
      </div>
      <div class="field">
        <label>Tags (comma separated, emojis allowed)</label>
        <input id="mTags" type="text" placeholder="e.g. ⚔️ weapons, 🗺️ maps" />
        <div id="tagSuggestions" style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;"></div>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;">
        <button class="btn" id="cancelBtn">Cancel</button>
        <button class="btn primary" id="saveBtn">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/admin.js"></script>
</body>
</html>
